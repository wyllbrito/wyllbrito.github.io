media:
  input: images
  output: images

content:
  - name: projetos
    label: Projetos
    type: file
    path: projetos.json
    format: json
    fields:
      - name: projetos
        label: Lista de projetos (a ordem daqui é a ordem no site)
        type: object
        list: true
        fields:
          - name: titulo
            label: Título
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: English, type: string }
          - name: tag
            label: Etiqueta (por exemplo, Estudo de caso de UX)
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: English, type: string }
          - name: descricao
            label: Descrição
            type: object
            fields:
              - { name: pt, label: Português, type: text }
              - { name: en, label: English, type: text }
          - name: botao
            label: Texto do botão (opcional; se vazio, usa "Ver projeto completo")
            type: object
            fields:
              - { name: pt, label: Português, type: string }
              - { name: en, label: English, type: string }
          - name: capa
            label: Capa
            type: image
          - name: tipo
            label: Tipo (externo abre um link, pagina abre uma página por blocos, interno é das páginas antigas)
            type: select
            default: externo
            options:
              values: [externo, pagina, interno]
          - name: link
            label: Link (para projetos do tipo externo)
            type: string
          - name: pagina
            label: Página interna (só para elaine, solace ou avanca)
            type: string
          - name: slug
            label: Endereço da página (só letras minúsculas, números e hífen; para o tipo pagina)
            type: string
          - name: info
            label: Papel, ano e escopo (para o tipo pagina)
            type: object
            fields:
              - { name: papel, label: Meu papel, component: curto }
              - { name: ano, label: Ano de realização, component: curto }
              - { name: escopo, label: Escopo do projeto, component: curto }
          - name: blocos
            label: Blocos da página (para o tipo pagina)
            type: block
            list: true
            blockKey: bloco
            blocks:
              - name: imagem
                fields:
                  - { name: titulo, label: Título da seção, component: curto }
                  - { name: imagem, label: Imagem, type: image }
                  - { name: alt, label: Descrição da imagem, component: curto }
              - name: galeria
                fields:
                  - { name: titulo, label: Título da seção, component: curto }
                  - { name: imagens, label: Imagens da galeria, type: image, list: true }
              - name: video
                fields:
                  - { name: titulo, label: Título da seção, component: curto }
                  - { name: youtube, label: Link ou código do vídeo do YouTube, type: string }
              - name: texto
                fields:
                  - { name: titulo, label: Título da seção, component: curto }
                  - { name: texto, label: Texto (deixe uma linha em branco entre parágrafos), component: longo }

  - name: textos
    label: Textos do site
    type: file
    path: textos.json
    format: json
    fields:
      - name: hero
        label: Apresentação (início da página)
        type: object
        fields:
          - { name: tag, label: Linha acima do nome, component: curto }
          - { name: descricao, label: Descrição abaixo do nome, component: longo }
          - { name: atualmente, label: Atualmente, component: curto }
          - { name: base, label: Base, component: curto }
          - { name: disponibilidade, label: Disponibilidade, component: curto }
      - name: sobre
        label: Sobre mim
        type: object
        fields:
          - { name: titulo_inicio, label: Título (parte normal), component: curto }
          - { name: titulo_destaque, label: Título (parte em verde), component: curto }
          - { name: paragrafo1, label: Parágrafo 1, component: longo }
          - { name: paragrafo2, label: Parágrafo 2, component: longo }
          - { name: paragrafo3, label: Parágrafo 3, component: longo }
          - { name: paragrafo4, label: Parágrafo 4, component: longo }
          - { name: paragrafo5, label: Parágrafo 5, component: longo }
      - name: ficha
        label: Ficha ao lado do Sobre mim
        type: object
        fields:
          - { name: nome, label: Nome, component: curto }
          - { name: idade, label: Idade, component: curto }
          - { name: local, label: Baseado em, component: curto }
          - { name: idiomas, label: Idiomas, component: curto }
          - { name: nacionalidade, label: Nacionalidade, component: curto }
          - name: formacao
            label: Formação
            type: object
            fields:
              - { name: curso, label: Curso, component: curto }
              - { name: detalhe, label: Instituição e período, component: curto }
              - { name: certificado, label: Certificado, component: curto }
      - name: contato
        label: Contato
        type: object
        fields:
          - { name: titulo_inicio, label: Título (começo), component: curto }
          - { name: titulo_destaque, label: Título (parte em verde), component: curto }
          - { name: titulo_fim, label: Título (final), component: curto }
          - { name: descricao, label: Descrição, component: longo }

components:
  curto:
    type: object
    fields:
      - { name: pt, label: Português, type: string }
      - { name: en, label: English, type: string }
  longo:
    type: object
    fields:
      - { name: pt, label: Português, type: text }
      - { name: en, label: English, type: text }
